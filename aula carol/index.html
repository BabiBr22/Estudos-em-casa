<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="index.css">
</head>

<body>
    <h1>Título Principal</h1>
    <h2>Subtítulo</h2>
    <p>Parágrafo de texto.</p>
    <a href="https://www.exemplo.com">Link</a>
    <img src="imagem.jpg" alt="Descrição da imagem">
    <ul>
        <li>Item de lista não ordenada</li>
    </ul>
    <ol>
        <li>Item de lista ordenada</li>
    </ol>
    <div>Divisão genérica</div>
    <span>Texto inline</span>
    <input type="text" placeholder="Digite algo">
    <button>Botão</button>

    <p id="demo">Texto original</p>
    <button onclick="mostrarAlerta()">Clique para alerta</button>
    <button onclick="mudarTexto()">Clique para mudar texto</button>


    <script>
        function mostrarAlerta() {
            alert("Olá, mundo!");
        }

        function mudarTexto() {
            document.getElementById("demo").innerText = "Texto alterado!";
        }


        //         Exercícios:

        // Crie um botão que muda o texto de um parágrafo.

        // Faça um campo de input onde o texto digitado aparece em outro lugar ao clicar em um botão.

        // Crie um contador com dois botões: um para aumentar e outro para diminuir o número exibido.

        
    </script>






</body>
